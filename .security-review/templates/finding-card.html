<article class="finding">
  <header>
    <h3>{{id}} - {{title}}</h3>
    <span class="severity {{severity}}">{{severity}}</span>
  </header>
  <p>{{description}}</p>
  <dl>
    <dt>Confidence</dt>
    <dd>{{confidence}}</dd>
    <dt>Status</dt>
    <dd>{{status}}</dd>
    <dt>CWE</dt>
    <dd>{{cwe}}</dd>
    <dt>OWASP</dt>
    <dd>{{owasp}}</dd>
  </dl>
  <details>
    <summary>Evidence</summary>
    <pre>{{evidence}}</pre>
  </details>
  <details>
    <summary>Remediation</summary>
    <p>{{remediation}}</p>
  </details>
</article>
