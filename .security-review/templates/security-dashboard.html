<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Review Dashboard</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5d667a;
      --line: #d8deea;
      --critical: #9f1239;
      --high: #dc2626;
      --medium: #d97706;
      --low: #2563eb;
      --info: #0f766e;
      --ok: #15803d;
      --chip: #eef2f7;
      --focus: #2563eb;
      --shadow: 0 10px 30px rgba(23, 32, 51, 0.08);
    }

    [data-theme="dark"] {
      --bg: #111827;
      --panel: #172033;
      --text: #f5f7fb;
      --muted: #b9c1d3;
      --line: #303b52;
      --chip: #253149;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      padding: 24px clamp(16px, 4vw, 48px);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 3;
    }

    .topbar {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: clamp(24px, 3vw, 34px);
    }

    h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 16px;
    }

    .subtitle {
      color: var(--muted);
      margin: 6px 0 0;
      max-width: 980px;
    }

    .actions,
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button,
    label.file-button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font: inherit;
      min-height: 38px;
    }

    button.primary {
      background: var(--focus);
      border-color: var(--focus);
      color: #ffffff;
    }

    button:hover,
    label.file-button:hover {
      border-color: var(--focus);
    }

    input,
    select,
    textarea {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
      min-height: 38px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }

    main {
      padding: 24px clamp(16px, 4vw, 48px) 56px;
      display: grid;
      gap: 22px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .metrics {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 98px;
      display: grid;
      align-content: space-between;
      gap: 8px;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    .metric strong {
      font-size: 28px;
    }

    .layout {
      grid-template-columns: minmax(260px, 0.9fr) minmax(320px, 1.6fr);
      align-items: start;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: var(--chip);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 13px;
    }

    .severity {
      border-radius: 999px;
      padding: 4px 8px;
      font-weight: 700;
      font-size: 12px;
      color: #ffffff;
    }

    .Critical { background: var(--critical); }
    .High { background: var(--high); }
    .Medium { background: var(--medium); }
    .Low { background: var(--low); }
    .Informational { background: var(--info); }

    .finding {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      gap: 12px;
      margin-bottom: 12px;
    }

    .finding-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    details {
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    summary {
      cursor: pointer;
      font-weight: 700;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--chip);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
      font-size: 13px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 110px 1fr 44px;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .bar-track {
      height: 10px;
      background: var(--chip);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--focus);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 700;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .score {
      display: grid;
      gap: 10px;
    }

    .score-ring {
      width: 140px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      margin: 0 auto;
      background: conic-gradient(var(--ok) var(--score-pct), var(--chip) 0);
    }

    .score-ring span {
      background: var(--panel);
      width: 104px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 28px;
      font-weight: 800;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>Security Review Dashboard</h1>
        <p class="subtitle" id="projectSubtitle">Load a Security Review Framework v2 JSON report or use the embedded sample report.</p>
      </div>
      <div class="actions">
        <button id="themeButton" type="button">Toggle Theme</button>
        <button id="sampleButton" type="button">Load Sample</button>
        <button id="markdownButton" type="button">Export Markdown</button>
        <button id="csvButton" type="button">Export CSV</button>
      </div>
    </div>
  </header>

  <main>
    <section>
      <h2>Report Input</h2>
      <div class="grid">
        <div class="actions">
          <label class="file-button" for="fileInput">Upload JSON</label>
          <input class="hidden" id="fileInput" type="file" accept="application/json,.json">
          <button class="primary" id="renderButton" type="button">Render Report</button>
          <span class="status" id="inputStatus">Paste report JSON below or load the sample.</span>
        </div>
        <textarea id="jsonInput" spellcheck="false"></textarea>
      </div>
    </section>

    <section>
      <h2>Executive Summary</h2>
      <div class="grid metrics" id="metrics"></div>
    </section>

    <div class="grid layout">
      <section>
        <h2>Coverage</h2>
        <div id="coverage"></div>
      </section>
      <section>
        <h2>Top Risks</h2>
        <div id="topRisks"></div>
      </section>
    </div>

    <div class="grid layout">
      <section>
        <h2>Severity Distribution</h2>
        <div id="severityBars"></div>
      </section>
      <section>
        <h2>File Heatmap</h2>
        <div id="fileHeatmap"></div>
      </section>
    </div>

    <section>
      <div class="topbar">
        <h2>Findings</h2>
        <div class="filters">
          <input id="searchInput" type="search" placeholder="Search findings">
          <select id="severityFilter">
            <option value="">All severities</option>
            <option>Critical</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
            <option>Informational</option>
          </select>
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option>Confirmed</option>
            <option>Potential Issue - Requires Verification</option>
            <option>False Positive</option>
            <option>Fixed</option>
            <option>Partially Fixed</option>
            <option>Not Fixed</option>
            <option>Accepted Risk</option>
          </select>
        </div>
      </div>
      <div id="findings"></div>
    </section>

    <section>
      <h2>Remediation Plan</h2>
      <div id="remediation"></div>
    </section>
  </main>

  <script>
    const sampleReport = {
      project: {
        name: "Example Commerce API",
        repository: "https://example.local/org/example-commerce-api",
        branch: "main",
        commit: "abc1234"
      },
      review: {
        date: "2026-06-29",
        reviewer: "GitHub Copilot using Security Review Framework v2",
        scope: "Sample report data for dashboard validation",
        mode: "deep",
        limitations: ["Sample data only", "No live repository was reviewed"]
      },
      summary: {
        overallRisk: "High",
        securityScore: 78,
        counts: { critical: 0, high: 1, medium: 1, low: 1, informational: 1 },
        topRisks: [
          "Object-level authorization gap on invoice access",
          "Sensitive data may be written to application logs",
          "Cloud storage encryption policy should be verified"
        ]
      },
      coverage: {
        technologies: ["Node.js", "Express", "PostgreSQL", "AWS S3"],
        areasReviewed: ["Authentication", "Authorization", "Input Validation", "Logging", "Cloud Storage"],
        attackSurface: ["REST APIs", "File downloads", "Background jobs"],
        dataClasses: ["PII", "Financial Data", "Credentials"]
      },
      riskMatrix: [
        { findingId: "SRF-001", likelihood: "High", impact: "High" },
        { findingId: "SRF-002", likelihood: "Medium", impact: "Medium" }
      ],
      fileHeatmap: [
        { file: "src/controllers/invoices.ts", riskScore: 88, critical: 0, high: 1, medium: 0, low: 0 },
        { file: "src/middleware/logger.ts", riskScore: 52, critical: 0, high: 0, medium: 1, low: 0 }
      ],
      findings: [
        {
          id: "SRF-001",
          title: "Object-level authorization missing on invoice download",
          severity: "High",
          confidence: "High",
          status: "Confirmed",
          category: "Authorization",
          cwe: "CWE-639",
          owasp: "API1:2023 Broken Object Level Authorization",
          asvs: "ASVS 4.0.3 V4.1",
          capec: "CAPEC-1",
          cvss: { score: 8.1, vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N" },
          affectedLocations: [
            { file: "src/controllers/invoices.ts", function: "downloadInvoice", startLine: 42, endLine: 67 }
          ],
          description: "The invoice download handler uses a request-controlled invoice ID without checking that the invoice belongs to the authenticated user or tenant.",
          evidence: [
            "The handler reads `req.params.invoiceId` and calls `Invoice.findById(invoiceId)`.",
            "No tenant or owner check is visible before returning the PDF."
          ],
          sourceToSink: {
            source: "req.params.invoiceId",
            transformations: ["String parameter passed to repository lookup"],
            validation: "No ownership validation visible",
            authorization: "Authentication exists, object-level authorization missing",
            sink: "PDF invoice response",
            impact: "Authenticated user can access another user's invoice by guessing or obtaining an ID"
          },
          exploitability: "An authenticated user can change the invoice ID in the URL and request invoices owned by other users if IDs are known or guessable.",
          attackScenario: "A user downloads their invoice, changes the URL parameter to another invoice ID, and receives another customer's billing document.",
          impact: "Unauthorized disclosure of billing data and potential cross-tenant data exposure.",
          likelihood: "High",
          remediation: "Fetch invoices by both ID and authorized tenant/user, or enforce an authorization policy before returning the file.",
          secureExample: "Invoice.findOne({ id: invoiceId, tenantId: req.user.tenantId })",
          references: ["OWASP API Security Top 10 API1:2023", "CWE-639"]
        },
        {
          id: "SRF-002",
          title: "Request logger may capture authorization headers",
          severity: "Medium",
          confidence: "Medium",
          status: "Potential Issue - Requires Verification",
          category: "Logging",
          cwe: "CWE-532",
          owasp: "A09:2021 Security Logging and Monitoring Failures",
          affectedLocations: [{ file: "src/middleware/logger.ts", startLine: 12 }],
          description: "The logger serializes request headers. It is unclear whether authorization headers are redacted before log export.",
          evidence: ["Request headers are included in structured log context."],
          sourceToSink: {
            source: "HTTP request headers",
            transformations: ["Serialized into structured log fields"],
            validation: "No redaction visible in sample",
            authorization: "Not applicable",
            sink: "Application logs",
            impact: "Potential credential exposure in logs"
          },
          exploitability: "If authorization headers are exported to centralized logs, users with log access may retrieve bearer tokens.",
          attackScenario: "An operator or compromised log account searches for authorization headers and reuses active bearer tokens.",
          impact: "Credential exposure and session hijacking risk.",
          likelihood: "Medium",
          remediation: "Redact `Authorization`, cookies, API keys, and tokens before logging request metadata.",
          secureExample: "redactHeaders(req.headers, ['authorization', 'cookie', 'x-api-key'])",
          references: ["CWE-532"]
        }
      ],
      remediationPlan: {
        immediate: ["Fix SRF-001 before release."],
        sprint: ["Verify and fix SRF-002 log redaction."],
        backlog: ["Add automated authorization regression tests."],
        hardening: ["Document log data classification and retention."]
      }
    };

    let activeReport = sampleReport;

    const el = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    function metric(label, value, extra = "") {
      return `<div class="metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong><small>${escapeHtml(extra)}</small></div>`;
    }

    function render(report) {
      activeReport = report;
      const project = report.project || {};
      const review = report.review || {};
      const summary = report.summary || {};
      const counts = summary.counts || {};
      const findings = report.findings || [];
      const score = Number(summary.securityScore ?? 0);

      el("projectSubtitle").textContent = `${project.name || "Unnamed project"} - ${review.scope || "Security review"} - ${review.date || "No date"}`;

      el("metrics").innerHTML = [
        `<div class="metric score"><span>Security Score</span><div class="score-ring" style="--score-pct:${score}%"><span>${score}</span></div><small>${escapeHtml(summary.overallRisk || "Unknown")} risk</small></div>`,
        metric("Critical", counts.critical ?? 0),
        metric("High", counts.high ?? 0),
        metric("Medium", counts.medium ?? 0),
        metric("Low", counts.low ?? 0),
        metric("Info", counts.informational ?? 0),
        metric("Findings", findings.length, review.mode || "")
      ].join("");

      renderCoverage(report.coverage || {});
      renderTopRisks(summary.topRisks || [], review.limitations || []);
      renderSeverityBars(counts);
      renderHeatmap(report.fileHeatmap || []);
      renderFindings();
      renderRemediation(report.remediationPlan || {});
    }

    function renderCoverage(coverage) {
      const groups = [
        ["Technologies", coverage.technologies],
        ["Areas Reviewed", coverage.areasReviewed],
        ["Attack Surface", coverage.attackSurface],
        ["Data Classes", coverage.dataClasses]
      ];
      el("coverage").innerHTML = groups.map(([label, values]) => `
        <h3>${label}</h3>
        <div class="chips">${(values || []).map(v => `<span class="chip">${escapeHtml(v)}</span>`).join("") || "<span class='status'>No data</span>"}</div>
      `).join("");
    }

    function renderTopRisks(risks, limitations) {
      const riskList = risks.length ? risks.map(r => `<li>${escapeHtml(r)}</li>`).join("") : "<li>No top risks reported.</li>";
      const limitList = limitations.length ? limitations.map(r => `<li>${escapeHtml(r)}</li>`).join("") : "<li>No limitations reported.</li>";
      el("topRisks").innerHTML = `<h3>Top Risks</h3><ol>${riskList}</ol><h3>Review Limitations</h3><ul>${limitList}</ul>`;
    }

    function renderSeverityBars(counts) {
      const rows = [
        ["Critical", counts.critical || 0],
        ["High", counts.high || 0],
        ["Medium", counts.medium || 0],
        ["Low", counts.low || 0],
        ["Informational", counts.informational || 0]
      ];
      const max = Math.max(1, ...rows.map(([, value]) => value));
      el("severityBars").innerHTML = rows.map(([name, value]) => `
        <div class="bar-row">
          <span>${name}</span>
          <div class="bar-track"><div class="bar-fill ${name}" style="width:${(value / max) * 100}%"></div></div>
          <strong>${value}</strong>
        </div>
      `).join("");
    }

    function renderHeatmap(rows) {
      if (!rows.length) {
        el("fileHeatmap").innerHTML = "<p class='status'>No file heatmap data.</p>";
        return;
      }
      el("fileHeatmap").innerHTML = `
        <table>
          <thead><tr><th>File</th><th>Risk</th><th>C</th><th>H</th><th>M</th><th>L</th></tr></thead>
          <tbody>
          ${rows.map(row => `
            <tr>
              <td>${escapeHtml(row.file)}</td>
              <td>${escapeHtml(row.riskScore ?? "")}</td>
              <td>${escapeHtml(row.critical ?? 0)}</td>
              <td>${escapeHtml(row.high ?? 0)}</td>
              <td>${escapeHtml(row.medium ?? 0)}</td>
              <td>${escapeHtml(row.low ?? 0)}</td>
            </tr>
          `).join("")}
          </tbody>
        </table>`;
    }

    function renderFindings() {
      const query = el("searchInput").value.trim().toLowerCase();
      const severity = el("severityFilter").value;
      const status = el("statusFilter").value;
      const findings = (activeReport.findings || []).filter(finding => {
        const text = JSON.stringify(finding).toLowerCase();
        return (!query || text.includes(query)) &&
          (!severity || finding.severity === severity) &&
          (!status || finding.status === status);
      });

      if (!findings.length) {
        el("findings").innerHTML = "<p class='status'>No findings match the current filters.</p>";
        return;
      }

      el("findings").innerHTML = findings.map(finding => {
        const locations = (finding.affectedLocations || []).map(loc => {
          const line = loc.startLine ? `:${loc.startLine}` : "";
          return `${loc.file || "unknown"}${line}${loc.function ? " - " + loc.function : ""}`;
        }).join(", ");
        const flow = finding.sourceToSink || {};
        return `
          <article class="finding">
            <div class="finding-head">
              <div>
                <h3>${escapeHtml(finding.id)} - ${escapeHtml(finding.title)}</h3>
                <div class="meta">
                  <span>${escapeHtml(finding.category || "")}</span>
                  <span>${escapeHtml(finding.confidence || "")} confidence</span>
                  <span>${escapeHtml(finding.status || "")}</span>
                  <span>${escapeHtml(finding.cwe || "")}</span>
                  <span>${escapeHtml(finding.owasp || "")}</span>
                </div>
              </div>
              <span class="severity ${escapeHtml(finding.severity || "Informational")}">${escapeHtml(finding.severity || "Info")}</span>
            </div>
            <p>${escapeHtml(finding.description || "")}</p>
            <p><strong>Location:</strong> ${escapeHtml(locations || "Not reported")}</p>
            <details open>
              <summary>Evidence</summary>
              <ul>${(finding.evidence || []).map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
            </details>
            <details>
              <summary>Source To Sink</summary>
              <pre>${escapeHtml([
                `source: ${flow.source || "unknown"}`,
                `transformations: ${(flow.transformations || []).join(" | ") || "unknown"}`,
                `validation: ${flow.validation || "unknown"}`,
                `authorization: ${flow.authorization || "unknown"}`,
                `sink: ${flow.sink || "unknown"}`,
                `impact: ${flow.impact || "unknown"}`
              ].join("\\n"))}</pre>
            </details>
            <details>
              <summary>Exploitability And Impact</summary>
              <p><strong>Exploitability:</strong> ${escapeHtml(finding.exploitability || "")}</p>
              <p><strong>Attack scenario:</strong> ${escapeHtml(finding.attackScenario || "")}</p>
              <p><strong>Impact:</strong> ${escapeHtml(finding.impact || "")}</p>
              <p><strong>Likelihood:</strong> ${escapeHtml(finding.likelihood || "")}</p>
            </details>
            <details>
              <summary>Remediation</summary>
              <p>${escapeHtml(finding.remediation || "")}</p>
              ${finding.secureExample ? `<pre>${escapeHtml(finding.secureExample)}</pre>` : ""}
            </details>
          </article>
        `;
      }).join("");
    }

    function renderRemediation(plan) {
      const groups = ["immediate", "sprint", "backlog", "hardening"];
      el("remediation").innerHTML = groups.map(group => `
        <h3>${group[0].toUpperCase()}${group.slice(1)}</h3>
        <ul>${((plan[group] || []).map(item => `<li>${escapeHtml(item)}</li>`).join("")) || "<li>No items.</li>"}</ul>
      `).join("");
    }

    function parseAndRender() {
      try {
        const report = JSON.parse(el("jsonInput").value);
        render(report);
        el("inputStatus").textContent = "Report rendered.";
      } catch (error) {
        el("inputStatus").textContent = `Invalid JSON: ${error.message}`;
      }
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    function exportMarkdown() {
      const report = activeReport;
      const lines = [
        `# Security Review - ${report.project?.name || "Project"}`,
        "",
        `Score: ${report.summary?.securityScore ?? "N/A"}/100`,
        `Overall Risk: ${report.summary?.overallRisk || "Unknown"}`,
        "",
        "## Findings",
        ...(report.findings || []).flatMap(f => [
          "",
          `### ${f.id} - ${f.title}`,
          `Severity: ${f.severity}`,
          `Confidence: ${f.confidence}`,
          `Status: ${f.status}`,
          "",
          f.description || "",
          "",
          `Remediation: ${f.remediation || ""}`
        ])
      ];
      download("security-review-report.md", lines.join("\\n"), "text/markdown");
    }

    function exportCsv() {
      const header = ["id", "title", "severity", "confidence", "status", "category", "cwe", "owasp"].join(",");
      const rows = (activeReport.findings || []).map(f => [
        f.id, f.title, f.severity, f.confidence, f.status, f.category, f.cwe, f.owasp
      ].map(value => `"${String(value ?? "").replaceAll('"', '""')}"`).join(","));
      download("security-review-findings.csv", [header, ...rows].join("\\n"), "text/csv");
    }

    el("renderButton").addEventListener("click", parseAndRender);
    el("sampleButton").addEventListener("click", () => {
      el("jsonInput").value = JSON.stringify(sampleReport, null, 2);
      render(sampleReport);
      el("inputStatus").textContent = "Sample report loaded.";
    });
    el("markdownButton").addEventListener("click", exportMarkdown);
    el("csvButton").addEventListener("click", exportCsv);
    el("themeButton").addEventListener("click", () => {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "" : "dark";
    });
    el("searchInput").addEventListener("input", renderFindings);
    el("severityFilter").addEventListener("change", renderFindings);
    el("statusFilter").addEventListener("change", renderFindings);
    el("fileInput").addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      el("jsonInput").value = await file.text();
      parseAndRender();
    });

    el("jsonInput").value = JSON.stringify(sampleReport, null, 2);
    render(sampleReport);
  </script>
</body>
</html>
